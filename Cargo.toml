[package]
name = "discord-bot"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
dotenv = "0.15.0"
env_logger = "0.11.8"
log = "0.4.27"
reqwest = { version = "0.12.15", features = ["json"] }
serde = "1.0.219"
serenity = { version = "0.12.4", features = ["cache"] }
sqlx = { version = "0.8.5", features = ["mysql", "macros", "runtime-tokio-rustls"] }
tokio = "1.45.0"
